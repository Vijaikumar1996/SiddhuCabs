  <section class="contact-section">
    <h1>Contact Us</h1>

    <p class="contact-text">
      Get in touch with <strong> <span class="app-name"></span></strong> for quick taxi bookings
      and travel assistance. We are available 24/7.
    </p>

    <div class="contact-details">
      <p class="contact-name">

        <i class="fa-brands fa-whatsapp"></i>

          Chat with us on WhatsApp
        </a>
      </p>

      <p>
        <i class="fa fa-envelope"></i>
        <strong>Email:</strong>
        <a onclick="redirectToEmail()" href="javascript:void(0)"><span class="contact-email"></span></a>

        <i class="fa fa-location-dot"></i>

  </script>


  <!-- owl carousel script -->
  <script type="text/javascript">
    var globalConfig = {};
    $(document).ready(function () {
      loadConfig()
        .done(function (config) {
          console.log('Config loaded', config);
          globalConfig = config;
          assignConfigValues(config);
          // initialize app with config
        })
        .fail(function (jqXHR, textStatus, errorThrown) {
          console.error('Failed to load config.json:', textStatus, errorThrown);
        });

    });
    function redirectToEmail() {
      const emailAddress = globalConfig.contactEmail;
      window.location.href = `mailto:${emailAddress}`;
    }

    function redictToWhatsapp() {
      const whatsappNumber = globalConfig.mobileNo.replace("+", ""); // 👉 your number
      let message = `Hello, I would like to inquire about your cab services.`;
      message = encodeURIComponent(message);
      const whatsappURL = `https://wa.me/${whatsappNumber}?text=${message}`;
      window.open(whatsappURL, '_blank');
    }

    function callNow() {
      const phoneNumber = globalConfig.mobileNo.replace("+", "");// country code + number
      window.location.href = 'tel:' + phoneNumber;
    }

  </script>
  <!-- end owl carousel script -->


  <a onclick="callNow();" class="call-float" aria-label="Call Us">
    <i class="fa fa-phone color-white"></i>
  </a>

  <a onclick="redictToWhatsapp();" class="whatsapp-float" aria-label="Chat on WhatsApp">
    <i class="fa-brands fa-whatsapp color-white"></i>
  </a>
