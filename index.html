  <!-- owl carousel script -->
  <script type="text/javascript">
    var pickupDetails = {};
    var dropoffDetails = {};
    var selectedVehicle = null;

    $(document).ready(function () {
      loadConfig()
        .done(function (config) {
          console.log('Config loaded', config);
          globalConfig = config;
          assignConfigValues(config);
          // initialize app with config
        })
        .fail(function (jqXHR, textStatus, errorThrown) {
          console.error('Failed to load config.json:', textStatus, errorThrown);
        });
      generateTimeSlots();
      const today = new Date().toISOString().split('T')[0];

      $('#pickup-date')
        .attr('min', today)   // disable past dates
        .val(today);
    });

    $('#phoneNumber').on('input', function () {
      this.value = this.value.replace(/\D/g, '');
    });

    $('.input-location').autocomplete({
      source: function (request, response) {
        $.getJSON(
          globalConfig.locationApi,
          {
            q: request.term,
            countrycodes: 'in',
            format: 'json',
            addressdetails: 1,
            limit: 5
          },
          function (data) {
            response(
              data
                .filter(p => p.address && p.address.state === 'Tamil Nadu')
                .map(place => ({
                  label: place.display_name,
                  value: place.display_name,
                  lat: place.lat,
                  lon: place.lon
                }))
            );
          }
        );
      },
      minLength: 3,
      select: function (event, ui) {
        if (event.target.dataset.type === 'pickup') {
          pickupDetails = {
            lat: ui.item.lat,
            lon: ui.item.lon,
            address: ui.item.label
          };
        } else if (event.target.dataset.type === 'dropoff') {
          dropoffDetails = {
            lat: ui.item.lat,
            lon: ui.item.lon,
            address: ui.item.label
          };
        }
        let approxDistance = calculateDistance();
        if (approxDistance) {
          approxDistance = Math.round(approxDistance) + ' km';
        } else {
          approxDistance = '';
        }
        $('#approxdistance').val(approxDistance);

        console.log('Distance', calculateDistance());
        console.log('event', event);
        console.log('ui', ui);
        console.log('Selected:', ui.item.label);
        console.log('Lat:', ui.item.lat, 'Lon:', ui.item.lon);
      }
    });

    function calculateDistance() {
      if (pickupDetails.lat && dropoffDetails.lat) {
        let lat1 = parseFloat(pickupDetails.lat);
        let lon1 = parseFloat(pickupDetails.lon);
        let lat2 = parseFloat(dropoffDetails.lat);
        let lon2 = parseFloat(dropoffDetails.lon);
        const R = 6371; // Earth radius in KM
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);

        const a =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos(toRad(lat1)) *
          Math.cos(toRad(lat2)) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);

        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        return R * c;
      }
      return null;
    }
    function toRad(value) {
      return (value * Math.PI) / 180;
    }

    function getTaxi() {
      let phoneNumber = $('#phoneNumber').val();
      let approxDistance = $('#approxdistance').val() || 0;
      approxDistance = approxDistance.replace(' km', '');
      approxDistance = parseFloat(approxDistance);

      if (!pickupDetails.address || !dropoffDetails.address) {
        alert('Please enter both pickup and dropoff locations.');
        return;
      }
      if (!pickupDetails.lat || !dropoffDetails.lat) {
        alert('Please select valid pickup and dropoff locations from suggestions.');
        return;
      }

      if (!phoneNumber) {
        alert('Please enter your phone number.');
        return;
      }
      if (phoneNumber.length < 10) {
        alert('Please enter a valid phone number.');
        return;
      }

      let vehicleBuilder = "";

      vehicleBuilder += '<div class="vehicle-grid">';
      $.each(globalConfig.vehicleTypes, function (index, vehicle) {
        vehicleBuilder += '<div class="vehicle-card">';
        vehicleBuilder += '<h4>' + vehicle.type + '</h4>';
        vehicleBuilder += '<p class="vehicle-desc">' + vehicle.description + '</p>';
        vehicleBuilder += '<p class="vehicle-desc">' + vehicle.perKmRate + '</p>';
        vehicleBuilder += '<p class="vehicle-price">' + (vehicle.price * approxDistance) + '</p>';
        vehicleBuilder +=
          '<button onclick="selectVehicle(\'' +
          vehicle.type + '\',' +
          approxDistance +
          ')">Select ' +
          vehicle.type +
          '</button>';

        vehicleBuilder += '</div>';
      });


      vehicleBuilder += '</div>';

      $('.vehicle-section').html(vehicleBuilder);

      // Show vehicle selection section
      $('.vehicle-section').show();
    }

    function selectVehicle(vehicletype, approxDistance) {
      selectedVehicle = $.grep(globalConfig.vehicleTypes, function (vehicle, idx) {
        return vehicle.type === vehicletype;
      })
      selectedVehicle = selectedVehicle[0];
      let vehicle = selectedVehicle;
      console.log('Selected vehicle:', vehicle);
      $('.selected-vehicle-title').text(vehicle.type + ' - Rs. ' + (vehicle.price * approxDistance));
      // Show booking section
      $('.booking-section').show();
    }

    function generateTimeSlots(intervalMinutes = 30) {
      const select = $('#pickup-time');
      select.empty();
      select.append('<option value="">Select Pickup Time</option>');

      let startMinutes = 0;       // 00:00
      let endMinutes = 24 * 60;   // 24:00

      for (let mins = startMinutes; mins < endMinutes; mins += intervalMinutes) {
        let hours = Math.floor(mins / 60);
        let minutes = mins % 60;

        let ampm = hours >= 12 ? 'PM' : 'AM';
        let displayHour = hours % 12;
        displayHour = displayHour === 0 ? 12 : displayHour;

        let timeLabel =
          String(displayHour).padStart(2, '0') + ':' +
          String(minutes).padStart(2, '0') + ' ' + ampm;

        select.append(
          `<option value="${timeLabel}">${timeLabel}</option>`
        );
      }
    }

    function bookNow() {
      let name = $('#name').val();
      let pickupDate = $('#pickup-date').val();
      let pickupTime = $('#pickup-time').val();

      if (!name) {
        alert('Please enter your name.');
        return;
      }
      if (!pickupDate) {
        alert('Please select pickup date.');
        return;
      }
      if (!pickupTime) {
        alert('Please select pickup time.');
        return;
      }


      const formattedDate = new Date(pickupDate).toLocaleDateString('en-IN', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });

      const whatsappNumber = globalConfig.mobileNo.replace("+", ""); // 👉 your number

      const message =
        `🚕 Taxi Booking Request

Name: ${name}
Pickup Date: ${formattedDate}
Pickup Time: ${pickupTime}

Vehicle Type: ${selectedVehicle.type}
Estimated Fare: ₹${selectedVehicle.price * parseFloat($('#approxdistance').val().replace(' km', ''))}

Please confirm availability.`;

      const whatsappURL =
        `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;

      window.open(whatsappURL, '_blank');
      $(".prebookDetails").hide();
      $("#bookingMessage").show();
    }

    function redictToWhatsapp() {
      const whatsappNumber = globalConfig.mobileNo.replace("+", ""); // 👉 your number
      let message = `Hello, I would like to inquire about your cab services.`;
      message = encodeURIComponent(message);
      const whatsappURL = `https://wa.me/${whatsappNumber}?text=${message}`;
      window.open(whatsappURL, '_blank');
    }

    function callNow() {
      const phoneNumber = globalConfig.mobileNo.replace("+", "");// country code + number
      window.location.href = 'tel:' + phoneNumber;
    }


  </script>

  <a onclick="redictToWhatsapp();" class="whatsapp-float" aria-label="Chat on WhatsApp">
